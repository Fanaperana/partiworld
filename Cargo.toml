[package]
name = "partiworld"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = "0.20.1"
bevy_egui = "0.43.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
toml = "1"
rhai = { version = "1.27", features = ["sync"] }
fastnoise-lite = "1.1"
bincode = "=1.3.3"
lz4_flex = "0.14"
pw_core = { path = "crates/pw_core" }
pw_mods = { path = "crates/pw_mods" }
pw_world = { path = "crates/pw_world" }
pw_objects = { path = "crates/pw_objects" }
pw_worldgen = { path = "crates/pw_worldgen" }
pw_sim = { path = "crates/pw_sim" }
pw_colony = { path = "crates/pw_colony" }
pw_game = { path = "crates/pw_game" }
pw_save = { path = "crates/pw_save" }
pw_render = { path = "crates/pw_render" }
pw_ui = { path = "crates/pw_ui" }

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
pw_core.workspace = true
pw_mods.workspace = true
pw_game.workspace = true
pw_render.workspace = true
pw_ui.workspace = true

# Fast deps in debug builds; our own code stays quick to compile.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
