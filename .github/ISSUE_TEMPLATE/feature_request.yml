name: Feature idea
description: Suggest something new for the game, the modding tools or the art.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. Please check the [open issues](https://github.com/Fanaperana/partiworld/issues) and the [roadmap](https://github.com/Fanaperana/partiworld#roadmap) first in case it's already planned.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you be able to do in the game? Describe it from the player's side.
      placeholder: I'd like colonists to cook meat over a campfire, so a meal fills them up more than raw meat.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What problem does it solve, or what would it make more fun?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Colony and colonists
        - Wildlife and evolution
        - Tribes
        - World, weather and physics
        - God powers
        - Art and look
        - Modding and data
        - Interface and controls
        - Something else
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Optional. Any thoughts on how to build it, for example whether it could be data in a mod or needs new Rust code.
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I'd like to work on this myself.
